name: Terraform CI

on:
  push:
    branches:
      - feature/firstpipeline

permissions:
  contents: read
  id-token: write

jobs:
  terraform-ci-pipeline:

    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: environments/prod

    steps:

      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Check TFLint Installation
      - name: Check TFLint
        shell: powershell
        run: |
          tflint --version

      # 5. Initialize TFLint
      - name: Initialize TFLint
        shell: powershell
        run: |
          tflint --init

      # 6. Run TFLint
      - name: Run TFLint
        shell: powershell
        run: |
          tflint

      # 7. Checkov Security Scan
      - name: Run Checkov Security Scan
        shell: powershell
        run: |
          checkov -d . --framework terraform --skip-check CKV2_AZURE_31 --output sarif

      # 8. Terraform Format Check
      - name: Terraform Format Check
        shell: powershell
        run: |
          terraform fmt -check -recursive

      # 9. Terraform Init
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init

      # 10. Terraform Validate
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate

      # 11. Terraform Plan
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan -out=tfplan